<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ImpacGo Laundry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ImpacGo Laundry</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS API, required by google_maps_flutter on web. Uses the
       existing Android Maps key as a placeholder; if it's restricted to the
       Android app package/SHA-1, the map will fail to load on web until a
       key without that restriction (or with the web origin allowed) is set. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCo04iR_FHx_khIq1B5WnpYaHTVckSp1l0" async></script>

  <!-- Boot splash: shown the instant the HTML parses, before the Flutter
       engine downloads/boots, so there's no blank white flash on load.
       Mirrors lib/Screens/splash_screen.dart's mark/wordmark/brand color
       so the handoff into the real Flutter splash is seamless. -->
  <style>
    html, body { background: #00433D; height: 100%; margin: 0; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #00433D; transition: opacity 0.3s ease;
    }
    #boot-splash .mark {
      width: 72px; height: 72px; border-radius: 20px; background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }
    #boot-splash .word {
      margin-top: 16px; color: #ffffff; font-weight: 700; font-size: 24px;
      letter-spacing: 0.2px; font-family: -apple-system, Roboto, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="mark">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="13" r="6.2" stroke="#00433D" stroke-width="2"/>
        <circle cx="12" cy="13" r="2.4" fill="#00433D"/>
        <rect x="4.5" y="4" width="3" height="2" rx="1" fill="#00433D"/>
      </svg>
    </div>
    <div class="word">ImpacGo</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      }
    });
  </script>
</body>
</html>
